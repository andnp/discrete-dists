[package]
name = "discrete-dists-core"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Sum-tree core for discrete-dists"

[dependencies]
ndarray = { version = "~0.17", features = ["serde"] }
rand_core = "~0.10"
rand_xoshiro = { version = "~0.8", features = ["serde"] }
serde = { version = "~1.0", features = ["derive"] }

[dev-dependencies]
bincode = { version = "~2.0", features = ["serde"] }
proptest = "~1.12"
criterion = { package = "codspeed-criterion-compat", version = "~5.0" }

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "window"
harness = false

[[bench]]
name = "uniform_set"
harness = false

[[bench]]
name = "prioritized"
harness = false

[[bench]]
name = "alias"
harness = false

[[bench]]
name = "reservoir"
harness = false
