[workspace]
members = [".", "crates/discrete-dists-core"]

[workspace.package]
version = "1.4.0"

[package]
name = "discrete-dists"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "discrete_dists"
path = 'rust/lib.rs'
crate-type = ["cdylib"]

[dependencies]
bincode = { version = "~2.0", features = ["serde"] }
discrete-dists-core = { path = "crates/discrete-dists-core" }
numpy = "~0.30"
pyo3 = "~0.30"
serde = { version = "~1.0", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
