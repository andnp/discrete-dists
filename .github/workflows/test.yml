name: Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test.yml'
      - '.github/workflows/CI.yml'
      - '.github/workflows/tag.yml'
      - 'discrete_dists/**'
      - 'rust/**'
      - 'crates/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/test.yml'
      - '.github/workflows/CI.yml'
      - '.github/workflows/tag.yml'
      - 'discrete_dists/**'
      - 'rust/**'
      - 'crates/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'requirements.txt'

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    steps:
      # setup the repository
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: ${{ github.job }}

      - run: |
          uv sync --frozen --extra dev --no-install-project
          source .venv/bin/activate
          maturin develop --release

      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - run: uv lock --check

      # linting
      - run: ruff check .

      # type checking
      - run: pyright

  test:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      # setup the repository
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: ${{ github.job }}-${{ matrix.python-version }}

      - run: |
          uv sync --frozen --extra dev --no-install-project --python ${{ matrix.python-version }}
          source .venv/bin/activate
          maturin develop --release

      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - run: pytest tests/

  rust:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pyo3's build script needs an interpreter for clippy on the bindings crate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test -p discrete-dists-core
