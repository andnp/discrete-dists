name: CodSpeed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      # setup the repository
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: ${{ github.job }}

      - run: |
          uv sync --frozen --extra dev --no-install-project
          source .venv/bin/activate
          maturin develop --release

      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest benches/ --codspeed

  rust-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed

      - run: cargo codspeed build -p discrete-dists-core

      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -p discrete-dists-core
